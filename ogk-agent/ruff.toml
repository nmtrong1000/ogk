# Ruff lint and format for ogk-agent. scripts/check_imports.py imports packages only to prove they install,
# so F401 is off there.
line-length = 120
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "dist", "build"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
"scripts/check_imports.py" = ["F401"]
