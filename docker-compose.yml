# Runs OGK-Server and OGK-Dashboard: docker compose up --build
# Every setting comes from .env next to this file (copy .env.example); a missing variable stops compose with its name.
# Certificates and the policy key must exist first: ogk-server/certs/gen_certs.sh and
# python -m app.cli gen-policy-key (in ogk-server).
# Only server.crt, server.key, ca.crt and policy_signing.pem are mounted, never ca.key.
# The Agent Service and Tray UI run directly on the Mac, not in Docker.

services:
  dashboard:
    build: ./ogk-dashboard
    volumes:
      - dashboard-dist:/out

  server:
    build: ./ogk-server
    depends_on:
      dashboard:
        condition: service_completed_successfully
    environment:
      OGK_DATA_KEY: ${OGK_DATA_KEY:?OGK_DATA_KEY is missing}
      OGK_HOST: ${OGK_HOST:?OGK_HOST is missing}
      OGK_PORT: ${OGK_PORT:?OGK_PORT is missing}
      OGK_TRUSTED_PROXIES: ${OGK_TRUSTED_PROXIES:?OGK_TRUSTED_PROXIES is missing}
      OGK_DATABASE_URL: ${OGK_DATABASE_URL:?OGK_DATABASE_URL is missing}
      OGK_TLS_CERT: ${OGK_TLS_CERT:?OGK_TLS_CERT is missing}
      OGK_TLS_KEY: ${OGK_TLS_KEY:?OGK_TLS_KEY is missing}
      OGK_DASHBOARD_DIST: ${OGK_DASHBOARD_DIST:?OGK_DASHBOARD_DIST is missing}
      OGK_POLICY_SIGNING_KEY: ${OGK_POLICY_SIGNING_KEY:?OGK_POLICY_SIGNING_KEY is missing}
      OGK_REPORT_TZ: ${OGK_REPORT_TZ:-Asia/Ho_Chi_Minh}
      OGK_SEED_PASSWORD: ${OGK_SEED_PASSWORD:-}
    volumes:
      - server-data:${OGK_CONTAINER_DATA_DIR:?OGK_CONTAINER_DATA_DIR is missing}
      - dashboard-dist:${OGK_DASHBOARD_DIST}:ro
      - ${OGK_CERT_DIR:?OGK_CERT_DIR is missing}/server.crt:${OGK_TLS_CERT}:ro
      - ${OGK_CERT_DIR}/server.key:${OGK_TLS_KEY}:ro
      - ${OGK_CERT_DIR}/ca.crt:${OGK_CA_CERT:?OGK_CA_CERT is missing}:ro
      - ${OGK_CERT_DIR}/policy_signing.pem:${OGK_POLICY_SIGNING_KEY}:ro
    ports:
      - "${OGK_PORT}:${OGK_PORT}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl, urllib.request; urllib.request.urlopen('https://localhost:${OGK_PORT}/api/health', context=ssl.create_default_context(cafile='${OGK_CA_CERT}'), timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  dashboard-dist:
  server-data:
